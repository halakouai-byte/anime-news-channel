# Keepalive ماهانه — ضد غیرفعال‌شدن کرون بعد از ۶۰ روز بدون فعالیت ریپو.
# یک کامیت کوچک در logs/keepalive.md می‌نویسد؛ اگر انتشار منظم برقرار باشد
# این ورک‌فلو عملاً چیزی برای انجام ندارد (state هر روز کامیت می‌شود).
name: Keepalive

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record keepalive
        run: |
          mkdir -p logs
          echo "- $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC: keepalive — repo active, crons alive" >> logs/keepalive.md

      - name: Commit keepalive log
        run: |
          git config user.name "anime-news-publisher"
          git config user.email "anime-news-publisher@users.noreply.github.com"
          git add logs/keepalive.md
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "keepalive: monthly activity record [skip ci]"
          git pull --rebase origin main || true
          git push origin main || (git pull --rebase origin main && git push origin main)
