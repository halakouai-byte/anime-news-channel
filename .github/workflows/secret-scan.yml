# Anime News Channel — secret scan (day one).
# Runs gitleaks on every push / PR and once a week, and fails on any
# finding. No token of any kind is used by this workflow: the pinned
# release binary is downloaded and run directly, so no pattern literal
# (and no credential name) lives in this file.
# Pattern: LiveForge build.yml (gitleaks step, lines 29-37), plus the
# SHA256 verification step the manager ordered (LiveForge's build.yml
# does not have it yet — it only downloads and extracts).
name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history: gitleaks scans every commit, not just the tip.
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --verbose --exit-code 1
