# ورک‌فلوی پشتیبان — sweeper
# هر ۱۵ دقیقه می‌چرخد؛ اگر Worker یا dispatch خبر تازه‌ای را جا انداخت،
# خبرهای جامانده را منتشر می‌کند. هم‌زمان keepalive است: هر انتشار state را
# کامیت می‌کند، پس کرون بعد از ۶۰ روز غیرفعال نمی‌شود.
# تصمیم قطعی کاربر (قفل‌شده ۲۱ نوامبر ۲۰۲۶): سکوت شبانه نیست؛ انتشار ۲۴/۷.
name: Sweeper

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "حداکثر پست در این اجرا"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: anime-news-publish
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Critic fix 2026-11-21 (review #1, run 44932633874): same defect as
    # publish.yml — the sweeper runs the same publish.py with the same
    # 15-min pacing sleep, so a 10-min timeout would kill any 2-post run
    # the same way. 60 min, same reasoning as publish.yml.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch + filter + queue
        run: python scripts/fetch.py

      - name: Publish missed items to Telegram
        # NOTE (2026-11-21 ~00:40 Tehran, manager fix): this step used
        # to be guarded by `if: secrets.TELEGRAM_BOT_TOKEN != '' ...` —
        # that made the whole workflow file INVALID ("Unrecognized
        # named-value: 'secrets'"), so every Sweeper run since 07:39 UTC
        # failed validation before any job started, and no scheduled run
        # was created after the last push. The `secrets` context cannot
        # be used in `if:` conditions. The guard is removed: both
        # secrets are set (verified 2026-11-21), and publish.py fails
        # loudly if they ever go missing — the same alarm behaviour as
        # publish.yml.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/publish.py --max-posts ${{ inputs.max_posts || 2 }}

      - name: Commit state + queue + archive + logs
        if: always()
        run: |
          git config user.name "anime-news-publisher"
          git config user.email "anime-news-publisher@users.noreply.github.com"
          # ضد مسابقه (فانتوم ۱۵/۱۶، ۲۲ نوامبر ۲۰۲۶): به‌جای pull --rebase
          # (که روی state/queue/archive تداخل می‌خورد و state را می‌انداخت)،
          # merge_state.py رکوردها را union می‌کند و با merge -s ours push می‌کند.
          # + برگرداندن فایل‌های غیر‌داده از origin/main پیش از merge
          # (حادثه ۲۴ نوامبر ۲۰۲۶، مرج 3c34da3): ورکر فقط data/ و logs/
          # را مالک است؛ کلون کهنه نباید کد/داک را برگرداند.
          python scripts/merge_state.py --commit-message "sweeper: update state/queue/archive [skip ci]"

