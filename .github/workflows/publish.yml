# ورک‌فلوی انتشار — publisher اصلی (هیبرید)
# بیدار می‌شود با repository_dispatch از Cloudflare Worker (وقتی خبر تازه هست)
# یا دستی با workflow_dispatch.
# تصمیم قطعی کاربر (قفل‌شده ۲۱ نوامبر ۲۰۲۶): سکوت شبانه نیست؛ انتشار ۲۴/۷،
# شامل ۰۲:۰۰ تا ۰۷:۰۰ تهران. هیچ پنجره سکوت شبانه‌ای در این فایل نیست.
name: Publish

on:
  repository_dispatch:
    types: [new-items]
  workflow_dispatch:
    inputs:
      max_posts:
        description: "حداکثر پست در این اجرا"
        required: false
        default: "2"
      dry:
        description: "اجرای خشک (بدون sendPhoto)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: anime-news-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Critic fix 2026-11-21 (review #1, run 44932633874): timeout MUST exceed
    # the pacing sleep — publish.py waits up to 15 min between posts
    # (MIN_GAP_MINUTES), so a 2-post run needs ~17 min. With 15 it was
    # killed mid-sleep and the 2nd post never went out. 60 covers up to
    # ~4 posts (3 gaps) with headroom; the 15-min gap itself stays (product
    # rule — audience pacing, not to be shortened to fit the timeout).
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Playwright فقط fallback کاور است و در این ورک‌فلو نصب مرورگر
          # نمی‌خواهد؛ کاور V3 با Pillow رندر می‌شود (scripts/cover.py).

      - name: Fetch + filter + queue
        run: python scripts/fetch.py

      - name: Publish queue to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ]; then
            python scripts/publish.py --max-posts ${{ inputs.max_posts || 2 }} --dry
          else
            python scripts/publish.py --max-posts ${{ inputs.max_posts || 2 }}
          fi

      - name: Commit state + queue + archive + logs
        if: always()
        run: |
          git config user.name "anime-news-publisher"
          git config user.email "anime-news-publisher@users.noreply.github.com"
          git add data/state.json data/queue.json data/archive.jsonl logs/ || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "publish: update state/queue/archive [skip ci]"
          # اگر کامیت state بعد از ارسال شکست خورد: یک بار pull --rebase + retry
          git pull --rebase origin main || true
          git push origin main || (git pull --rebase origin main && git push origin main)
