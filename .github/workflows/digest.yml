# خلاصه هفتگی (Digest) — جمعه‌ها — فاز ۴
# وضعیت: غیرفعال. Digest از آیتم‌های `digest-candidate` در archive.jsonl
# (رتبه‌بندی، Blu-rayِ فقط تاریخ، کاتالوگ فرنچایز بزرگ — حداکثر ۵ آیتم در
# یک پست) ساخته می‌شود و فقط در فاز ۴ فعال می‌شود.
# برای فعال‌کردن: کرون زیر را از کامنت دربیاور و `if: false` را از job بردار.
name: Digest

on:
  # schedule:
  #   - cron: "30 10 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    # فاز ۴ — فعلاً غیرفعال
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build + publish weekly digest (phase 4 — not implemented yet)
        run: |
          echo "Digest is disabled until phase 4 (see ARCHITECTURE.md §11)."
          exit 1
